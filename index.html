<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mahjBot — American Mahjong</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">mahjBot</span>
          <span class="brand-sub">American Mahjong · 2026 card</span>
        </div>
        <div class="stats" id="stats"></div>
        <div class="toolbar">
          <button type="button" id="btn-new" class="btn btn-primary">New Game</button>
          <button type="button" id="btn-watch" class="btn">Watch</button>
          <button type="button" id="btn-play" class="btn">Play as East</button>
          <button type="button" id="btn-step" class="btn">Step</button>
          <button type="button" id="btn-auto" class="btn">Auto</button>
          <label class="run-count" title="Number of watch games to simulate">
            <input type="number" id="run-count" min="1" max="10000" value="100" />
            <button type="button" id="btn-run" class="btn">Run</button>
          </label>
          <button type="button" id="btn-clear" class="btn btn-ghost" title="Clear win stats">Clear</button>
        </div>
      </header>

      <main class="table-wrap">
        <aside class="results-panel" aria-label="Game results">
          <h3 class="results-title">Completions</h3>
          <div class="chart" id="chart"></div>
          <h3 class="results-title">Tiles left at mahjong</h3>
          <p class="results-sub">Wall remaining in groups of 10</p>
          <div class="chart" id="chart-rounds"></div>
          <h3 class="results-title">Games</h3>
          <div class="results-feed" id="results-feed"></div>
        </aside>
        <div class="felt" id="felt">
          <section class="seat seat-west" data-seat="West">
            <div class="seat-meta">
              <h2>West</h2>
              <div class="seat-stats"></div>
            </div>
            <ol class="seat-hands"></ol>
            <div class="rack exposed"></div>
            <div class="rack hand"></div>
          </section>

          <section class="seat seat-north" data-seat="North">
            <div class="seat-meta">
              <h2>North</h2>
              <div class="seat-stats"></div>
            </div>
            <ol class="seat-hands"></ol>
            <div class="rack exposed"></div>
            <div class="rack hand"></div>
          </section>

          <section class="seat seat-east" data-seat="East">
            <div class="seat-meta">
              <h2>East <span class="you-tag" hidden>you</span></h2>
              <div class="seat-stats"></div>
            </div>
            <ol class="seat-hands"></ol>
            <div class="rack exposed"></div>
            <div class="rack hand"></div>
          </section>

          <section class="seat seat-south" data-seat="South">
            <div class="seat-meta">
              <h2>South</h2>
              <div class="seat-stats"></div>
            </div>
            <ol class="seat-hands"></ol>
            <div class="rack exposed"></div>
            <div class="rack hand"></div>
          </section>

          <div class="center">
            <div class="center-status" id="status"></div>
            <div class="discard-area">
              <div class="discard-label">Discard</div>
              <div class="discard-tile" id="discard"></div>
            </div>
            <div class="wall-count" id="wall"></div>
            <div class="action-row" id="actions"></div>
            <div class="log" id="log"></div>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
